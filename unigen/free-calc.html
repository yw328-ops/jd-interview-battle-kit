<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自由速算 · 你的自由余额是多少</title>
<style>
  :root{
    --ink:#1c1c1e; --paper:#f6f4ef; --card:#ffffff; --line:#e4e0d8;
    --accent:#2f6b4f; --accent-soft:#e7ede6; --muted:#8a8578; --danger:#9a3e2e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:0 0 60px}
  /* ---------- 通用 ---------- */
  .screen{display:none;padding:32px 24px;animation:fade .35s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:10px;font-weight:600}
  h1{font-size:30px;line-height:1.3;font-weight:700;letter-spacing:.5px}
  h2{font-size:20px;line-height:1.45;font-weight:700}
  .sub{font-size:14px;color:var(--muted);line-height:1.8;margin-top:12px}
  .btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s, opacity .15s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  /* ---------- 开场 ---------- */
  #screen-start{text-align:left}
  .seal{width:64px;height:64px;border-radius:18px;background:var(--accent);color:#f2f0e8;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:28px}
  .start-meta{margin-top:36px;font-size:13px;color:var(--muted);line-height:2}
  /* ---------- 题目 ---------- */
  .progress-wrap{margin-bottom:8px}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
  .progress-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}
  .q-counter{font-size:13px;color:var(--accent);font-weight:600;margin:22px 0 6px}
  .q-title{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:22px}
  .q-dim{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;line-height:1.7}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-size:14.5px;line-height:1.65;cursor:pointer;transition:border-color .15s, background .15s;text-align:left;font-family:inherit;color:var(--ink)}
  .opt:active{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .next-row{display:flex;gap:10px;margin-top:20px}
  .next-row .btn{flex:1}
  .btn-back{flex:0 0 auto;width:auto;padding:16px 18px;background:transparent;border:1.5px solid var(--line);border-radius:14px;font-size:14px;color:var(--muted);cursor:pointer}
  /* ---------- loading ---------- */
  #screen-loading{text-align:center;padding-top:90px}
  .scanner{margin:0 auto 30px;width:72px;height:72px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-size:15px;color:var(--ink);font-weight:600}
  .loading-sub{font-size:12px;color:var(--muted);margin-top:10px}
  /* ---------- 报告 ---------- */
  #screen-report{padding-top:28px}
  .report-seal{font-size:12px;color:var(--accent);letter-spacing:3px;font-weight:600;margin-bottom:16px}
  .balance-label{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:2px}
  .balance{font-size:62px;font-weight:800;letter-spacing:-1.5px;line-height:1.08}
  .balance .unit{font-size:19px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:2px}
  .tier-row{margin:10px 0 0}
  .tier-chip{display:inline-block;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600;letter-spacing:1px}
  .tier-0{background:#f2e0da;color:var(--danger)}
  .tier-1{background:#f0e6da;color:#8a5a2b}
  .tier-2{background:var(--accent-soft);color:var(--accent)}
  .tier-3{background:var(--ink);color:#e6cfa6}
  .report-sub{font-size:13.5px;color:#4a463e;line-height:1.9;margin-top:14px}
  .report-sub b{color:var(--accent)}
  .free-banner{margin-top:18px;background:linear-gradient(135deg,#1c1c1e,#2f6b4f);color:#f0ede6;border-radius:14px;padding:18px;font-size:13.5px;line-height:1.9}
  .free-banner .fb-label{font-size:11px;letter-spacing:2px;color:#cfe0d0;margin-bottom:8px;font-weight:600}
  .power-line{margin-top:22px;background:var(--ink);color:#f0ede6;border-radius:14px;padding:16px 18px;font-size:14px;line-height:1.9}
  .power-line b{color:#e6cfa6}
  .section{margin-top:30px}
  .section-title{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .section-title .bar{width:3px;height:14px;background:var(--accent);border-radius:2px}
  .dim-card{background:var(--card);border-radius:14px;padding:18px 18px 16px;margin-bottom:12px;border:1px solid var(--line)}
  .dim-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .dim-name{font-size:15px;font-weight:700}
  .dim-pct{font-size:15px;font-weight:700;color:var(--accent)}
  .dim-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
  .dim-fill{height:100%;background:var(--accent);border-radius:3px;width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
  .dim-talk{font-size:13px;line-height:1.85;color:#3d3a34}
  .dim-act{font-size:12.5px;line-height:1.8;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--accent)}
  .dim-act b{font-weight:600}
  .mind-box{background:var(--accent-soft);border-radius:14px;padding:16px 18px;font-size:13px;line-height:1.9;color:#33403a}
  .mind-box .mind-label{font-size:11px;letter-spacing:2px;color:var(--accent);margin-bottom:8px;font-weight:600}
  .note-box{background:var(--accent-soft);border-radius:14px;padding:16px 18px;font-size:13px;line-height:1.9;margin-top:16px;color:#33403a}
  .note-box .nb-label{font-size:11px;letter-spacing:2px;color:var(--accent);margin-bottom:8px;font-weight:600}
  /* 两栏清单 */
  .list-col{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line)}
  .list-col.ok{border-left:3px solid var(--accent)}
  .list-col.ng{border-left:3px solid var(--danger)}
  .lc-label{font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:10px}
  .list-col.ok .lc-label{color:var(--accent)}
  .list-col.ng .lc-label{color:var(--danger)}
  .lc-item{font-size:13.5px;line-height:1.75;color:#3d3a34;padding:5px 0 5px 14px;position:relative}
  .lc-item:before{content:'·';position:absolute;left:0;color:var(--accent);font-weight:700}
  .list-col.ng .lc-item:before{color:var(--danger)}
  .lc-empty{font-size:13px;line-height:1.8;color:var(--muted);padding:4px 0}
  .hook{margin-top:26px;padding:20px;border-radius:16px;background:linear-gradient(135deg,#1c1c1e,#2a3a2e);color:#f0ede6;text-align:center}
  .hook .h1{font-size:15px;font-weight:700;line-height:1.7}
  .hook .h2{font-size:12.5px;color:#b9c4b8;margin-top:10px;line-height:1.9}
  .hook .h2 b{color:#e6cfa6}
  .hook-sibling{font-size:12px;color:#8f9a8c;margin-top:14px;line-height:1.9}
  .hook-sibling a{color:#e6cfa6;text-decoration:underline}
  .footer-note{text-align:center;font-size:11px;color:#b9b2a5;margin-top:18px}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;white-space:nowrap}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <!-- 开场 -->
  <div class="screen active" id="screen-start">
    <div class="seal">🧮</div>
    <div class="kicker">FREEDOM CALCULATOR</div>
    <h1>自由<br>速算</h1>
    <p class="sub">把「我买得起多少自由」从一句感觉，变成一张速算表。<br>不问你想要什么——只算你现在有什么。</p>
    <div class="start-meta">
      · 12 道题，全是行为题：答的是账，不是人设<br>
      · 不算分、不评人，只出「自由余额」<br>
      · 约 4 分钟，答完生成你的余额单
    </div>
    <div style="margin-top:34px">
      <button class="btn btn-accent" onclick="startTest()">开始速算</button>
      <div style="height:12px"></div>
      <div style="text-align:center;font-size:12px;color:var(--muted)">账算得越实，数字越有用</div>
    </div>
  </div>

  <!-- 题目 -->
  <div class="screen" id="screen-quiz">
    <div class="progress-wrap">
      <div class="progress-label"><span id="qProgressText">第 1 / 12 题</span><span>算账，不算人</span></div>
      <div class="progress-bar"><div class="progress-fill" id="qProgressFill"></div></div>
    </div>
    <div class="q-counter" id="qCounter">PART 01</div>
    <div class="q-title" id="qTitle"></div>
    <div class="q-dim" id="qDim"></div>
    <div class="opts" id="qOpts"></div>
    <div class="next-row" style="display:none" id="nextRow">
      <button class="btn-back" onclick="prevQ()">← 上一题</button>
      <button class="btn btn-dark" id="nextBtn" onclick="nextQ()">下一题</button>
    </div>
  </div>

  <!-- Loading -->
  <div class="screen" id="screen-loading">
    <div class="scanner"></div>
    <div class="loading-text" id="loadingText">正在盘你的现金余粮…</div>
    <div class="loading-sub">把自由算成余额，请稍候</div>
  </div>

  <!-- 报告 -->
  <div class="screen" id="screen-report"></div>

</div>
<div class="toast" id="toast">已复制，去晒吧</div>

<script>
/* ============ 账户 ============
   cash=现金 skill=技能 cred=信用 body=身体 anchor=锚点
   每题选项 0-3 分；第 1 题选项带 base（存款能撑的月数）
   第 12 题计 mind（自由心态分，0-3，不进账户电量） */
const ACCOUNTS = [
  {id:'cash',   name:'现金账户', max:9},
  {id:'skill',  name:'技能账户', max:6},
  {id:'cred',   name:'信用账户', max:6},
  {id:'body',   name:'身体账户', max:6},
  {id:'anchor', name:'锚点账户', max:6}
];
const QUESTIONS = [
  {acct:'cash', part:'PART 01 · 现金账户', title:'如果明天公司通知你：下周不用来了。你能体面地撑____，再慢慢找路？', opts:[
    {t:'撑不过3个月——下个月账单就压上来', s:{cash:0}, base:2},
    {t:'3到6个月，够我喘口气再找', s:{cash:1}, base:4.5},
    {t:'半年到一年，我可以挑着找，不将就', s:{cash:2}, base:9},
    {t:'一年以上，我甚至有点想试试被裁', s:{cash:3}, base:18},
    {t:'我现在就走，谢谢——早准备好了', s:{cash:3}, base:24, egg:'你已经自由了。这份报告是给还没自由的人看的——你留着当个对照。'}
  ]},
  {acct:'cash', part:'PART 01 · 现金账户', title:'不算工资，你每个月躺着也能进账的钱（利息/理财/副业被动收入），占你支出的——', opts:[
    {t:'0——我全靠工资活着', s:{cash:0}},
    {t:'不到两成，够交个话费网费', s:{cash:1}},
    {t:'两三成，房租饭钱能盖住一部分', s:{cash:2}},
    {t:'五成以上——工资更像零花钱', s:{cash:3}}
  ]},
  {acct:'cash', part:'PART 01 · 现金账户', title:'你每个月的钱，花在「不得不花」（房租房贷/养家/固定账单）上的比例——', opts:[
    {t:'大头都是刚性——工资到账就没', s:{cash:0}},
    {t:'过半，剩下那点才有得选', s:{cash:1}},
    {t:'三四成——大部分我有的选', s:{cash:2}},
    {t:'很少——我的支出几乎都可调', s:{cash:3}}
  ]},
  {acct:'skill', part:'PART 02 · 技能账户', title:'脱下工牌，现在有几个人愿意为「你这个人」的本事付钱——', opts:[
    {t:'0——我的价值都挂在公司账上', s:{skill:0}},
    {t:'1-2个——接过私活，被人挖过', s:{skill:1}},
    {t:'几个老客户/老东家，有活会想到我', s:{skill:2}},
    {t:'有持续的进账，不靠工牌活着', s:{skill:3}}
  ]},
  {acct:'skill', part:'PART 02 · 技能账户', title:'你的看家本事，换个行业还剩几成——', opts:[
    {t:'三成不到——太垂直，离开这行没人懂', s:{skill:0}},
    {t:'五成左右，得补不少新东西', s:{skill:1}},
    {t:'七八成——底层能力是通用的', s:{skill:2}},
    {t:'几乎全带得走——我到哪都用得上', s:{skill:3}, egg:'你的本事不是工牌给的——是你自己长出来的。'}
  ]},
  {acct:'cred', part:'PART 03 · 信用账户', title:'你想换工作，不海投，能直接开口让几个人为你拍胸脯担保——', opts:[
    {t:'0——我好像没几个能开这种口的关系', s:{cred:0}},
    {t:'1-2个，但要想想怎么开口', s:{cred:1}},
    {t:'3个以上，我知道他们会帮', s:{cred:2}},
    {t:'不止——他们甚至会主动帮我张罗', s:{cred:3}}
  ]},
  {acct:'cred', part:'PART 03 · 信用账户', title:'前同事/客户遇到拿不准的大事，还会第一个想起找你吗——', opts:[
    {t:'不会——离职就淡了', s:{cred:0}},
    {t:'偶尔寒暄，大事轮不到我', s:{cred:1}},
    {t:'会来问我意见——我说的话他们信', s:{cred:2}},
    {t:'会——而且有人直接给我介绍活', s:{cred:3}, egg:'别人把大事第一个想到你——这是比工资更硬的货币。'}
  ]},
  {acct:'body', part:'PART 04 · 身体账户', title:'你最近一次体检报告上，箭头（异常项）有几个——', opts:[
    {t:'一堆——我都不敢细看', s:{body:0}},
    {t:'三五个，医生让我注意', s:{body:1}},
    {t:'一两个，无伤大雅', s:{body:2}},
    {t:'全绿——身体是省心的', s:{body:3}}
  ]},
  {acct:'body', part:'PART 04 · 身体账户', title:'过去一周，你睡够 7 小时的天数——', opts:[
    {t:'0-1天——长期欠觉', s:{body:0}},
    {t:'2-3天', s:{body:1}},
    {t:'4-5天', s:{body:2}},
    {t:'6-7天——睡眠是我的固定支出', s:{body:3}, egg:'把睡眠当固定支出的人，身体账户不会破产。'}
  ]},
  {acct:'anchor', part:'PART 05 · 锚点账户', title:'不靠「我是XX公司的」这个身份，你还稳稳地是谁——', opts:[
    {t:'想了一圈——工作之外，我好像没别人了', s:{anchor:0}, egg:'想了一圈只有同事——锚点账户，是辞职那天最疼的那个。'},
    {t:'有家人——但有些话没法跟他们说', s:{anchor:1}},
    {t:'有2-3个能说真话的朋友', s:{anchor:2}},
    {t:'有一群人——我混成什么样，回去都有位置', s:{anchor:3}}
  ]},
  {acct:'anchor', part:'PART 05 · 锚点账户', title:'上周让你真正开心的事，有几件——', opts:[
    {t:'一件都想不起来——日子是流水线', s:{anchor:0}},
    {t:'一两件，但小到不值一提', s:{anchor:1}},
    {t:'三四件——我记得住细节', s:{anchor:2}},
    {t:'五件以上——我活得很具体', s:{anchor:3}, egg:'五件以上——你活得比很多「成功人士」具体。'}
  ]},
  {acct:'mind', part:'PART 06 · 自由心态', title:'如果明天你账户多出一笔钱，刚好够你不工作活两年——你的第一反应是——', opts:[
    {t:'开始盘算：先辞职，把那件一直想干的事干了', s:{mind:3}},
    {t:'拿一部分出来试水，看能不能滚出第三条路', s:{mind:2}},
    {t:'先当没看见，继续上班——等我想清楚再说', s:{mind:1}, egg:'你连一个「假设」都不敢接——不是钱的问题，是想象力的问题。'},
    {t:'有点慌——我不知道自由了该干什么', s:{mind:0}, egg:'慌的不是那笔钱，是钱到账后你要面对的那个问题：然后呢？'}
  ]}
];

/* 账户解读：hi/lo = 电量高/低时的"账目说明"；ACT = 补账动作 */
const TALK = {
  cash:  {hi:'你兜里有粮。「不」的第一层底气，是饿不着。', lo:'兜里余粮太薄——你现在每说一个「不」，都得先跟房租商量。'},
  skill: {hi:'脱了工牌也有人为你付钱——你的本事在市场上有独立定价权。', lo:'你的本事还挂在工牌上——离开平台，定价权跟着缩水。'},
  cred:  {hi:'有人愿意为你担保、为你说话——这是自由最便宜的风控。', lo:'关系网还没到「有事有人接」——信用是自由的保险，你还没买。'},
  body:  {hi:'身体是自由的本金——你扛得起折腾，也等得起。', lo:'体检报告在预警——自由要的是续航，不是爆发。'},
  anchor:{hi:'离开工作身份你还有归处——这让人敢做选择。', lo:'你的人生支点还长在工位上——工作之外的空，是「不敢走」的隐形原因。'}
};
const ACT = {
  cash:  {hi:'把余粮再滚一档，目标 12 个月——到那档，「不」字不用过脑子。', lo:'先做一件事：列出每月刚性支出，砍掉一项可砍的——余粮从下个月开始涨。'},
  skill: {hi:'给「脱了工牌」的本事建个价目表，挂出去——让市场替你报价。', lo:'挑一个能脱离平台变现的本事，先用周末试水——从 0 到 1，比从 1 到 10 重要。'},
  cred:  {hi:'把担保人清单写下来，逢年过节真走动——信用要存，也要记得取。', lo:'这周主动帮一个前同事/客户一个小忙——信用是「被麻烦」出来的。'},
  body:  {hi:'把睡眠当固定支出守住——身体账户是全仓的底盘。', lo:'先解决体检报告最刺眼的那个箭头——身体是本钱，不是加分项。'},
  anchor:{hi:'每周留一块「不当谁」的时间——锚点要在，得常用。', lo:'先找一个人，说一件工作以外的心事——锚点从第一句真话开始长。'}
};

/* 自由档位（按月数） */
const TIERS = [
  {min:0,  name:'紧急状态', cls:'tier-0', main:'你的自由余额，撑不过一次「意外」。这不是批评——大多数人都在这一档。速算的价值是：让你看见缺口在哪一笔账上。'},
  {min:3,  name:'温饱自由', cls:'tier-1', main:'你买得起「喘口气」，还买不起「换方向」。差的几格通常不在现金账户——在最虚的那个账户里。'},
  {min:6,  name:'选择权自由', cls:'tier-2', main:'你买得起「挑活干」的底气——可以拒绝不合理的，挑自己认同的。这是多数人想要的自由，你已经在了。'},
  {min:12, name:'真自由', cls:'tier-3', main:'你买得起「停下来重新想」的奢侈。这是稀缺档——别把它浪费在刷手机上。'}
];

/* 两栏清单：账户电量 ≥60 进"说得出口"，<40 进"买不起" */
const CAN_SAY = {
  cash:  '拒绝一份降薪/没成长的活——兜里有粮，不必将就',
  skill: '挑客户、挑项目，不接不认同的活——本事在自己手里',
  cred:  '提离职、拒绝不合理要求——有人给你兜底',
  body:  '对消耗型加班文化说不——身体是最硬的谈判筹码',
  anchor:'离开烂环境——归处不在这张工牌上'
};
const CANT_SAY = {
  cash:  '想裸辞休息、给自己放个长假——但一算账就咽回去了',
  skill: '想做自由职业/转行——但怕离开平台没人付钱',
  cred:  '想开口求人介绍机会——但关系还没厚到能开口',
  body:  '想彻底停摆休整一场——但不敢病，因为没人能替你扛',
  anchor:'想换个城市/圈子重新开始——但除了同事，不知道还有谁'
};

/* 缺口钩子：weak = 最虚账户 id 或 'cash'/'none' */
const HOOK = {
  cash:  '你的缺口在【现金账户】——余粮不足，其他账户再健康，「不」字都说得心虚。这笔账能算清：先攒出 6 个月余粮，你的档位会直接跳一档。',
  skill: '你的缺口在【技能账户】——这不是焦虑，是一笔能算清的账：把「脱了工牌谁为你付钱」从 0 变成 1，你的自由余额直接翻倍。',
  cred:  '你的缺口在【信用账户】——本事再大，没人接住也白搭。信用是自由的风控：先让 3 个人愿意为你拍胸脯。',
  body:  '你的缺口在【身体账户】——自由要的是续航，不是爆发。先把体检报告最刺眼的那个箭头解决掉，其余账户才有意义。',
  anchor:'你的缺口在【锚点账户】——你在为谁、为什么而自由，这笔账还空着。锚点补上之前，多少钱都像在流浪。',
  none:  '你的账户没有明显短板——自由余额够你停下来想。剩下的问题只有一个：「然后呢？」——把自由真正花在你想要的地方。'
};

/* 心态（第 12 题）解读 */
const MIND = [
  '钱到账的第一反应是慌——慌的不是那笔钱，是钱到账后你要面对的问题：然后呢？这个问题的答案，比那笔钱值钱。',
  '你选择「当没看见」——不是钱的问题，是想象力的问题：你还没想好，自由了要干什么。',
  '你拿钱试水、买选项——这是会玩的人。自由对你不是终点，是下一个局的开局。',
  '你早就想好自由后要干什么了——你缺的从来不是方向，是那笔钱。而方向，恰恰是钱买不到的东西。'
];

/* ============ 状态 ============ */
let qi = 0;
const answers = [];   // 每题选中的 option index
const eggs = [];      // 彩蛋句（第1题E的横幅单独处理，不重复进）
const scores = {cash:0,skill:0,cred:0,body:0,anchor:0,mind:0};

function $(id){return document.getElementById(id)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}

/* ============ 流程 ============ */
function startTest(){qi=0;show('screen-quiz');renderQ()}

function renderQ(){
  const q = QUESTIONS[qi];
  $('qCounter').textContent = q.part;
  $('qTitle').textContent = q.title;
  $('qDim').textContent = qi===QUESTIONS.length-1 ? '最后一题，选第一反应——别替「自由的你」回答'
                                                  : '按真实情况选——算的是账，不是人设';
  $('qProgressText').textContent = '第 ' + (qi+1) + ' / 12 题';
  $('qProgressFill').style.width = (qi/12*100) + '%';
  $('qOpts').innerHTML = '';
  const sel = answers[qi];
  q.opts.forEach((op,oi)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = op.t;
    if(sel===oi) b.classList.add('sel');
    b.onclick = ()=>choose(oi,b);
    $('qOpts').appendChild(b);
  });
  document.querySelector('.btn-back').style.visibility = qi===0 ? 'hidden':'visible';
  $('nextBtn').textContent = qi===QUESTIONS.length-1 ? '生成余额单' : '下一题';
  $('nextBtn').style.opacity = (answers[qi]!==undefined && answers[qi]!==null) ? 1 : .4;
}
function choose(oi, el){
  const allBtns = $('qOpts').querySelectorAll('.opt');
  allBtns.forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  answers[qi]=oi;
  $('nextBtn').style.opacity = 1;
  // 单选快节奏，自动进下一题
  setTimeout(()=>{ if(qi<QUESTIONS.length-1){qi++;renderQ()} else {generate()} }, 220);
}
function nextQ(){
  if(answers[qi]===undefined || answers[qi]===null) return;
  if(qi<QUESTIONS.length-1){qi++;renderQ()}
  else generate();
}
function prevQ(){ if(qi>0){qi--;renderQ()} }

/* ============ 计分 ============ */
function generate(){
  Object.keys(scores).forEach(k=>scores[k]=0);
  eggs.length=0;
  QUESTIONS.forEach((q,i)=>{
    const a = answers[i];
    if(a===undefined || a===null) return;
    const o = q.opts[a];
    Object.keys(o.s).forEach(d=>scores[d]+=o.s[d]);
    if(o.egg && !(i===0 && a===4)) eggs.push(o.egg);  // 第1题E的egg走横幅
  });
  const ls=['正在盘你的现金余粮…','正在给你的本事估价…','正在数愿意为你担保的人…','正在量你的睡眠和箭头…','正在把你的「不」翻译成余额…'];
  $('loadingText').textContent = ls[Math.floor(Math.random()*ls.length)];
  show('screen-loading');
  setTimeout(buildReport, 2400);
}

/* ============ 报告 ============ */
function buildReport(){
  const pct = {};
  ACCOUNTS.forEach(d=>pct[d.id]=Math.min(100, Math.round(scores[d.id]/d.max*100)));

  // 自由余额 = 现金基准月数 × 自由质量系数（其余四账户的平均电量，0.55~1.0）
  const base = QUESTIONS[0].opts[answers[0]].base;
  const others = ['skill','cred','body','anchor'];
  const avgPct = others.reduce((s,id)=>s+pct[id],0)/others.length;
  const qFactor = 0.55 + 0.45*(avgPct/100);
  const months = Math.round(base*qFactor*10)/10;
  let tier = TIERS[0];
  for(let i=TIERS.length-1;i>=0;i--){ if(months>=TIERS[i].min){tier=TIERS[i];break;} }

  // 说不的底气（次/月）
  let spine;
  if(months<1) spine = '0 次——你现在的「不」，说出口都带着心虚';
  else if(months<3) spine = '1-2 次——只够用在刀刃上';
  else if(months<6) spine = '4-6 次——一周能有一次像样的「不」';
  else if(months<12) spine = '10-15 次——差不多隔天就能说一次';
  else spine = '你不需要数次数了——「不」只是你的常规词汇';

  // 缺口账户：四账户中最虚的；都健康则看现金基准
  let weak = others.slice().sort((a,b)=>pct[a]-pct[b])[0];
  if(pct[weak]>=60) weak = (base<6) ? 'cash' : 'none';

  const freeEgo = answers[0]===4;  // 第1题选了"我现在就走"

  // ---- 两栏清单 ----
  const canList = others.concat(['cash']).filter(id=>pct[id]>=60).map(id=>CAN_SAY[id]);
  const cantList = others.concat(['cash']).filter(id=>pct[id]<40).map(id=>CANT_SAY[id]);

  const el = $('screen-report');
  let html = '';
  html += '<div class="report-seal">FREEDOM STATEMENT · 自由余额单</div>';

  // 主数字
  html += '<div class="balance-label">你的自由余额</div>';
  html += '<div class="balance">'+months+'<span class="unit">个月</span></div>';
  html += '<div class="tier-row"><span class="tier-chip '+tier.cls+'">'+tier.name+'</span></div>';
  html += '<p class="report-sub">'+tier.main+'</p>';

  // 第一题选E的横幅
  if(freeEgo){
    html += '<div class="free-banner"><div class="fb-label">你选了「我现在就走」</div>你已经自由了——这份报告是给还没自由的人看的。留着它当个对照：帮他们把账算清楚，是你现在最该做的事。</div>';
  }

  // 总账
  html += '<div class="power-line">以你现在的资产结构，你说<b>「不」的底气</b> ≈ 每月 '+spine+'。</div>';

  // 五账户
  html += '<div class="section"><div class="section-title"><span class="bar"></span>五账户余额</div>';
  ACCOUNTS.forEach(d=>{
    const hi = pct[d.id]>=60;
    html += '<div class="dim-card">';
    html += '<div class="dim-top"><span class="dim-name">'+d.name+'</span><span class="dim-pct">'+pct[d.id]+'%</span></div>';
    html += '<div class="dim-bar"><div class="dim-fill" data-w="'+pct[d.id]+'"></div></div>';
    html += '<div class="dim-talk">'+TALK[d.id][hi?'hi':'lo']+'</div>';
    html += '<div class="dim-act"><b>补账动作 ▸</b> '+ACT[d.id][hi?'hi':'lo']+'</div>';
    html += '</div>';
  });
  html += '</div>';

  // 自由心态
  html += '<div class="section"><div class="section-title"><span class="bar"></span>自由心态 · 钱到账后的第一反应</div>';
  html += '<div class="mind-box">'+MIND[scores.mind]+'</div></div>';

  // 彩蛋
  if(eggs.length){
    html += '<div class="section"><div class="section-title"><span class="bar"></span>算账备注</div>';
    html += '<div class="note-box"><div class="nb-label">AI记账员的话</div>'+eggs.map(e=>'<div style="margin-bottom:8px">· '+e+'</div>').join('')+'</div></div>';
  }

  // 两栏清单
  html += '<div class="section"><div class="section-title"><span class="bar"></span>你说得出口的「不」</div>';
  if(canList.length){
    html += '<div class="list-col ok">'+canList.map(x=>'<div class="lc-item">'+x+'</div>').join('')+'</div>';
  } else {
    html += '<div class="list-col ok"><div class="lc-empty">这一栏是空的——你现在的「不」，大多要看别人脸色。空栏本身是信号：缺哪格，补哪格。</div></div>';
  }
  html += '<div class="section-title" style="margin-top:22px"><span class="bar" style="background:var(--danger)"></span>你想说、但暂时买不起的「不」</div>';
  if(cantList.length){
    html += '<div class="list-col ng">'+cantList.map(x=>'<div class="lc-item">'+x+'</div>').join('')+'</div>';
  } else {
    html += '<div class="list-col ng"><div class="lc-empty">这栏也是空的——你想说的「不」，基本都买得起。剩下那点缺口，不在清单上，在下一次想说出口的那一刻。</div></div>';
  }
  html += '</div>';

  // 缺口钩子
  html += '<div class="hook"><div class="h1">'+HOOK[weak].split('——')[0]+'</div>';
  html += '<div class="h2">'+HOOK[weak].split('——').slice(1).join('——')+'<br><br>把缺口补成计划，约一次<b>「一天审计」</b>——上午盘账户，下午列清单，傍晚带走你的《个人自由资产负债表》。</div></div>';
  html += '<div class="footer-note">自由速算 · 账算得越实，数字越有用</div>';

  // 分享
  const tierName = tier.name;
  const shareTxt = '我刚做了「自由速算」——我的自由余额是 '+months+' 个月（'+tierName+'）。算算你买得起多少自由。';
  html += '<div style="margin-top:18px;background:var(--card);border:1px dashed var(--accent);border-radius:14px;padding:14px 16px;font-size:13px;color:#4a463e;line-height:1.9" id="shareTxt">'+shareTxt+'</div>';
  html += '<div style="margin-top:16px;display:flex;gap:10px">';
  html += '<button class="btn btn-ghost" style="flex:1" onclick="copyShare()">复制分享语</button>';
  html += '<button class="btn btn-accent" style="flex:1" onclick="location.reload()">再算一次</button>';
  html += '</div>';
  html += '<div class="hook-sibling" style="margin-top:22px;text-align:center;color:var(--muted)">还测过「不可生成性体检」吗？看看 AI 偷不走你什么 → <a href="checkup-a.html">去测 A</a></div>';

  el.innerHTML = html;
  show('screen-report');
  setTimeout(()=>{el.querySelectorAll('.dim-fill').forEach(f=>{f.style.width=f.dataset.w+'%'})},120);
}

function copyShare(){
  const txt = document.getElementById('shareTxt').textContent;
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
  const t=$('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自由速算 · 给自由算账</title>
<style>
  :root{
    --ink:#1c1c1e; --paper:#f6f4ef; --card:#ffffff; --line:#e4e0d8;
    --gold:#a8744a; --gold-soft:#f0e6da; --muted:#8a8578; --green:#3f7d4e; --red:#9a3e2e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:0 0 60px}
  .screen{display:none;padding:32px 24px;animation:fade .35s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;letter-spacing:3px;color:var(--gold);margin-bottom:10px;font-weight:600}
  h1{font-size:30px;line-height:1.3;font-weight:700;letter-spacing:.5px}
  .sub{font-size:14px;color:var(--muted);line-height:1.8;margin-top:12px}
  .btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn-dark{background:var(--ink);color:#fff}
  .seal{width:64px;height:64px;border-radius:18px;background:var(--ink);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:28px;font-weight:700}
  .start-meta{margin-top:36px;font-size:13px;color:var(--muted);line-height:2}
  .progress-wrap{margin-bottom:8px}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
  .progress-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
  .q-counter{font-size:13px;color:var(--gold);font-weight:600;margin:22px 0 6px}
  .q-title{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:8px}
  .q-hint{font-size:12px;color:var(--muted);margin-bottom:14px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-size:14.5px;line-height:1.65;cursor:pointer;transition:border-color .15s,background .15s;text-align:left;font-family:inherit;color:var(--ink)}
  .opt:active{border-color:var(--gold)}
  .opt.sel{border-color:var(--gold);background:var(--gold-soft)}
  .next-row{display:flex;gap:10px;margin-top:20px;align-items:center}
  .next-row .btn{flex:1}
  .btn-back{flex:0 0 auto;padding:15px 18px;background:transparent;border:1.5px solid var(--line);border-radius:14px;font-size:14px;color:var(--muted);cursor:pointer}
  #screen-loading{text-align:center;padding-top:90px}
  .scanner{margin:0 auto 30px;width:72px;height:72px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-size:15px;font-weight:600}
  .loading-sub{font-size:12px;color:var(--muted);margin-top:10px}
  .report-head{text-align:left}
  .report-seal{font-size:12px;color:var(--gold);letter-spacing:3px;font-weight:600;margin-bottom:14px}
  .balance-big{font-size:15px;color:var(--muted);margin-bottom:4px}
  .balance-num{font-size:38px;font-weight:800;line-height:1.2;color:var(--ink)}
  .balance-num em{font-style:normal;color:var(--gold)}
  .tier-pill{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:#fff;background:var(--ink);border-radius:20px;padding:5px 16px}
  .tier-pill.warn{background:var(--red)}
  .tier-pill.good{background:var(--green)}
  .report-sub{font-size:13.5px;color:#4a463e;line-height:1.9;margin-top:14px}
  .section{margin-top:30px}
  .section-title{font-size:13px;font-weight:700;letter-spacing:2px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .section-title .bar{width:3px;height:14px;background:var(--gold);border-radius:2px}
  .dim-card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:11px;border:1px solid var(--line)}
  .dim-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .dim-name{font-size:14.5px;font-weight:700}
  .dim-pct{font-size:14px;font-weight:700;color:var(--gold)}
  .dim-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
  .dim-fill{height:100%;background:var(--ink);border-radius:3px;width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
  .dim-talk{font-size:12.5px;line-height:1.85;color:#3d3a34}
  .two-col{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .col{background:var(--card);border-radius:14px;padding:15px 16px;border:1px solid var(--line)}
  .col .ct{font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:9px}
  .col.ok .ct{color:var(--green)}
  .col.gap .ct{color:var(--red)}
  .col div{font-size:13px;line-height:1.9;color:#3d3a34}
  .col div b{color:var(--ink)}
  .note-box{background:var(--gold-soft);border-radius:14px;padding:15px 17px;font-size:13px;line-height:1.9;margin-top:14px}
  .note-box b{color:var(--gold)}
  .hook{margin-top:24px;padding:20px;border-radius:16px;background:linear-gradient(135deg,#1c1c1e,#2c2a28);color:#f0ede6;text-align:center}
  .hook .h1{font-size:15px;font-weight:700;line-height:1.6}
  .hook .h2{font-size:12px;color:#b9b2a5;margin-top:8px;line-height:1.8}
  .share-box{margin-top:16px;background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:13px 16px;font-size:13px;color:#4a463e;line-height:1.9}
  .footer-note{text-align:center;font-size:11px;color:#b9b2a5;margin-top:16px}
  .free-banner{background:var(--green);color:#fff;border-radius:14px;padding:16px;font-size:14.5px;font-weight:700;line-height:1.7;margin-bottom:16px}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;white-space:nowrap}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="screen active" id="screen-start">
    <div class="seal">🧮</div>
    <div class="kicker">FREEDOM CHECKUP</div>
    <h1>自由速算</h1>
    <p class="sub">给自由算账 · 速算版<br>把"我买得起多少自由"从感觉，变成一张速算表。</p>
    <div class="start-meta">
      · 12 道题，估算就好，别打开计算器<br>
      · 不审判，只出账本<br>
      · 约 5 分钟，答完出余额
    </div>
    <div style="margin-top:34px">
      <button class="btn btn-dark" onclick="startTest()">开始算账</button>
      <div style="height:12px"></div>
      <div style="text-align:center;font-size:12px;color:var(--muted)">答得越诚实，账越好看</div>
    </div>
  </div>

  <div class="screen" id="screen-quiz">
    <div class="progress-wrap">
      <div class="progress-label"><span id="qProgressText">第 1 / 12 题</span><span>估算就好</span></div>
      <div class="progress-bar"><div class="progress-fill" id="qProgressFill"></div></div>
    </div>
    <div class="q-counter" id="qCounter">PART 01 · 现金账户</div>
    <div class="q-title" id="qTitle"></div>
    <div class="q-hint" id="qHint"></div>
    <div class="opts" id="qOpts"></div>
    <div class="next-row" style="display:none" id="nextRow">
      <button class="btn-back" onclick="prevQ()">← 上一题</button>
      <button class="btn btn-dark" id="nextBtn" onclick="nextQ()">下一题</button>
    </div>
  </div>

  <div class="screen" id="screen-loading">
    <div class="scanner"></div>
    <div class="loading-text" id="loadingText">正在翻你的账本…</div>
    <div class="loading-sub">顺便看了看你的选择权余额</div>
  </div>

  <div class="screen" id="screen-report"></div>
</div>
<div class="toast" id="toast">已复制，去晒吧</div>

<script>
/* dims: c=现金 s=技能 x=信用 h=身体 a=锚点 */
const MAX = {c:12, s:6, x:6, h:6, a:6};
const DIMS = [
  {id:'c', name:'现金余额'},
  {id:'s', name:'变现余额'},
  {id:'x', name:'信用余额'},
  {id:'h', name:'身体余额'},
  {id:'a', name:'锚点余额'}
];
const QUESTIONS = [
  {part:'PART 01 · 现金账户', title:'如果明天公司通知你下周不用来了，你能体面地撑____个月？', hint:'（估算，不算借钱，不算卖惨）', opts:[
    {t:'不到3个月', s:{c:0}},
    {t:'3-6个月', s:{c:1}},
    {t:'6-12个月', s:{c:2}},
    {t:'一年以上', s:{c:3}},
    {t:'我现在就走，谢谢', s:{c:3}, free:true, egg:'你已经自由了——这份体检对你无效，去帮帮别人吧。'}
  ]},
  {part:'PART 01 · 现金账户', title:'存款、理财、可动用的钱加起来，不动工资能撑多久？', hint:'（估个大概就行，别真的打开计算器）', opts:[
    {t:'3个月内', s:{c:0}},
    {t:'半年左右', s:{c:1}},
    {t:'一年左右', s:{c:2}},
    {t:'两年以上', s:{c:3}},
    {t:'没算过，心里没底', s:{c:0}, egg:'"没算过"本身就是一条账：你不敢看的那页，往往最需要看。'}
  ]},
  {part:'PART 01 · 现金账户', title:'你的非工资收入（理财/利息/房租/版税…）占总开支的？', opts:[
    {t:'几乎没有，全靠工资', s:{c:0}},
    {t:'不到三成', s:{c:1}},
    {t:'三到五成', s:{c:2}},
    {t:'五成以上', s:{c:3}},
    {t:'什么是被动收入', s:{c:0}, egg:'被动收入=你睡着时也在进账的钱。你醒着的时间全在换钱，这是最贵的睡法。'}
  ]},
  {part:'PART 01 · 现金账户', title:'每月刚性支出（房贷/房租+孩子+父母+固定账单）占收入多少？', opts:[
    {t:'三成以内', s:{c:3}},
    {t:'五成左右', s:{c:1}},
    {t:'七成以上', s:{c:0}},
    {t:'月光——月底看账单才知道花了多少', s:{c:0}, egg:'你不是没钱，你是不知道钱去哪了。不知道=失控，失控比贫穷贵。'}
  ]},
  {part:'PART 02 · 变现余额', title:'如果明天脱了工牌，你估摸有多少人愿意为你的本事付钱？', opts:[
    {t:'我现在就有副业/接单在收钱', s:{s:3}},
    {t:'有人问过，还没接', s:{s:2}},
    {t:'没验证过，但我知道自己值', s:{s:1}},
    {t:'不确定——可能没人', s:{s:0}, egg:'"没人愿意付钱"通常是错觉，真相是"你还没把本事摆上货架"。'}
  ]},
  {part:'PART 02 · 变现余额', title:'你的核心技能换一个行业，还剩几成价值？', opts:[
    {t:'八成以上，是通吃型本事', s:{s:3}},
    {t:'五成左右，换行要补课', s:{s:1}},
    {t:'基本绑死在当前行业', s:{s:0}},
    {t:'没想过——我一直以为技能跟行业绑定', s:{s:0}, egg:'技能跟行业绑定的那部分，AI学得最快；不绑定的那部分，才是你的。'}
  ]},
  {part:'PART 03 · 信用余额', title:'想换工作，不投简历，能直接让几个人为你内推+担保？', opts:[
    {t:'三个以上，我心里有数', s:{x:3}},
    {t:'能想到一两个', s:{x:2}},
    {t:'不确定', s:{x:1}},
    {t:'我从不麻烦人', s:{x:0}, egg:'"从不麻烦人"的人，别人也会不好意思麻烦你——包括帮你。'}
  ]},
  {part:'PART 03 · 信用余额', title:'前同事/老客户遇到他们领域的事，会第一个想到找你吗？', opts:[
    {t:'会，最近还有人来找我', s:{x:3}},
    {t:'偶尔', s:{x:1}},
    {t:'离职即失联', s:{x:0}},
    {t:'我不确定我在别人那儿留下过什么', s:{x:0}, egg:'你留下的不是名片，是"这人靠谱"的记忆——想不起来=存款少，现在存还来得及。'}
  ]},
  {part:'PART 04 · 身体余额', title:'去年体检报告，几个箭头？', hint:'（身体是自由的地基，箭头=地基在漏气）', opts:[
    {t:'零个', s:{h:3}},
    {t:'一两个', s:{h:2}},
    {t:'三四个', s:{h:1}},
    {t:'没敢去体检/报告没看', s:{h:0}, egg:'不看报告不是没事，是怕有事。身体不会因为你假装它好就好。'}
  ]},
  {part:'PART 04 · 身体余额', title:'过去一周，睡够7小时的有几天？', opts:[
    {t:'五天以上', s:{h:3}},
    {t:'三四天', s:{h:2}},
    {t:'一两天', s:{h:1}},
    {t:'什么是睡够', s:{h:0}, egg:'睡眠不足的人，做决定都是困着做的——你以为的自由选择，可能是疲劳驾驶。'}
  ]},
  {part:'PART 05 · 锚点余额', title:'不靠"某公司某总监"这个身份，你还有谁？', hint:'（家人/老友/社群/兴趣圈，那些不因为你职位而爱你的人）', opts:[
    {t:'我有，而且最近还在联系', s:{a:3}},
    {t:'有，但很久没见了', s:{a:1}},
    {t:'工作圈子占了我几乎全部关系', s:{a:0}, egg:'如果身份没了关系就没了，那关系绑定的不是你，是你的工牌。'},
    {t:'这么一问，我愣住了', s:{a:0}, egg:'愣住的那几秒，就是答案——你太久没想过"我"是谁了。'}
  ]},
  {part:'PART 05 · 锚点余额', title:'上周让你真正开心（不是刷手机那种）的事，有几件？', opts:[
    {t:'三件以上，我说得出来', s:{a:3}},
    {t:'一两件', s:{a:1}},
    {t:'想不起来', s:{a:0}},
    {t:'开心？那是什么', s:{a:0}, egg:'这道题不是矫情——它是测"你还有没有不花钱的快乐来源"。没有的人，自由了也不知道干嘛。'}
  ]}
];

const EGGS = [];
let qi=0;
const answers=[];
const scores={c:0,s:0,x:0,h:0,a:0};
let freeFlag=false;

function $(id){return document.getElementById(id)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}
function startTest(){qi=0;show('screen-quiz');renderQ()}

function renderQ(){
  const q=QUESTIONS[qi];
  $('qCounter').textContent=q.part;
  $('qTitle').textContent=q.title;
  $('qHint').textContent=q.hint||'';
  $('qProgressText').textContent='第 '+(qi+1)+' / 12 题';
  $('qProgressFill').style.width=(qi/12*100)+'%';
  $('qOpts').innerHTML='';
  const sel=answers[qi];
  q.opts.forEach((op,oi)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=op.t;
    if(sel===oi) b.classList.add('sel');
    b.onclick=()=>{ document.querySelectorAll('#qOpts .opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); answers[qi]=oi;
      setTimeout(()=>{ if(qi<QUESTIONS.length-1){qi++;renderQ()} else generate() },220);
    };
    $('qOpts').appendChild(b);
  });
  document.querySelector('.btn-back').style.visibility=qi===0?'hidden':'visible';
  $('nextBtn').textContent=qi===QUESTIONS.length-1?'生成报告':'下一题';
  $('nextRow').style.display=qi===0?'none':'flex';
}
function nextQ(){ if(qi<QUESTIONS.length-1){qi++;renderQ()} }
function prevQ(){ if(qi>0){qi--;renderQ()} }

function generate(){
  Object.keys(scores).forEach(k=>scores[k]=0);
  EGGS.length=0; freeFlag=false;
  QUESTIONS.forEach((q,i)=>{
    const a=answers[i];
    if(a===undefined||a===null) return;
    const o=q.opts[a];
    Object.keys(o.s).forEach(d=>scores[d]+=o.s[d]);
    if(o.free) freeFlag=true;
    if(o.egg) EGGS.push(o.egg);
  });
  const ls=['正在翻你的账本…','正在数你的「不」字存款…','正在检查你的自由地基…'];
  $('loadingText').textContent=ls[Math.floor(Math.random()*ls.length)];
  show('screen-loading');
  setTimeout(buildReport,2200);
}

function buildReport(){
  const pcts={}; DIMS.forEach(d=>pcts[d.id]=Math.min(100,Math.round(scores[d.id]/MAX[d.id]*100)));
  const totalPct=Math.round(DIMS.reduce((a,d)=>a+pcts[d.id],0)/5);
  // 档位
  let tier, tierCls, tierSub;
  if(freeFlag){ tier='真自由'; tierCls='good'; tierSub='你已经把"不"字练成了母语。这份速算表对你已经过时——你该做的不是算账，是帮别人算。'; }
  else if(totalPct>=80){ tier='真自由'; tierCls='good'; tierSub='你的自由不是感觉，是资产负债表——你付得起"不"的代价，也付得起"要"的代价。'; }
  else if(totalPct>=55){ tier='选择权自由'; tierCls='good'; tierSub='你站在"不敢动"和"随时能动"的分界线上——再攒一两格，你就是自己人生的庄家。'; }
  else if(totalPct>=30){ tier='温饱自由'; tierCls=''; tierSub='你饿不着，但也松不开手。现在的自由是"不敢失去工资"的自由——先别急着要更多，把地基补一格是一格。'; }
  else { tier='紧急状态'; tierCls='warn'; tierSub='你的选择权余额偏低——但账算清了就不是绝境，是施工图。这页纸就是你动工的第一天。'; }

  // 说得出口的"不"（按高分账户）
  const sorted=[...DIMS].sort((a,b)=>pcts[b.id]-pcts[a.id]);
  const top=sorted[0], bottom=sorted[4];
  const canSay=[]; const cantSay=[];
  if(pcts.c>=50) canSay.push('你可以不接不想接的活——你付得起拒绝的代价');
  if(pcts.s>=50) canSay.push('你可以对不喜欢的工作说"再会"——你的本事在市场上有人要');
  if(pcts.x>=50) canSay.push('你可以麻烦别人——你的信用余额够你开口');
  if(pcts.h>=50) canSay.push('你可以拒绝熬夜加班——身体是你最硬的底气');
  if(pcts.a>=50) canSay.push('你可以离开让你内耗的圈子——工作之外你还有人');
  if(canSay.length<2){ const fallback=['你可以对一件小事说"不"——从今天开始练习','你可以拒绝一次无效社交——把时间还给自己']; canSay.push(...fallback.slice(0,2-canSay.length)); }
  cantSay.push('你说不出口的「不」：' + ({c:'钱没攒够，腰杆硬不起来',s:'本事还没摆上市场货架',x:'太久没存信任，开口怕被拒',h:'身体在报警，自由不敢用力',a:'卸了工牌，不知道自己是誰'}[bottom.id]));
  cantSay.push('最该补的一格：'+bottom.name+'——它不是焦虑，是一笔算得清的账');

  const el=$('screen-report');
  let html='<div class="report-head">';
  html+='<div class="report-seal">FREEDOM BALANCE REPORT</div>';
  if(freeFlag) html+='<div class="free-banner">🕊️ 你已经自由了——这份体检对你无效，去帮帮别人吧。</div>';
  html+='<div class="balance-big">你的自由余额</div>';
  html+='<div class="balance-num">'+tier+'</div>';
  html+='<div class="tier-pill '+tierCls+'">五账综合 '+totalPct+'%</div>';
  html+='<p class="report-sub">'+tierSub+'</p>';
  html+='</div>';

  html+='<div class="section"><div class="section-title"><span class="bar"></span>五个账户余额</div>';
  DIMS.forEach(d=>{
    const hi=pcts[d.id]>=50;
    const talk={c:['你的现金账户在报警——先攒"F-you money"，哪怕每月500','现金是自由的入场券——你已经买得起前几排了'],s:['脱了工牌没人付钱=你的本事还没上架','你的本事在市场上已经有人认了'],x:['你的信任存款薄——关系要开始存了','有人愿意为你说话——这是AI生成不了的资产'],h:['身体在漏气——地基不牢，上面的自由都是空中楼阁','身体是你的好队友——别透支它'],a:['工作之外你没有锚——小心把全部自己押在一份工上','你有人、有生活、有退路——这是最贵的自由']}[d.id][hi?1:0];
    html+='<div class="dim-card"><div class="dim-top"><span class="dim-name">'+d.name+'</span><span class="dim-pct">'+pcts[d.id]+'%</span></div>';
    html+='<div class="dim-bar"><div class="dim-fill" data-w="'+pcts[d.id]+'"></div></div>';
    html+='<div class="dim-talk">'+talk+'</div></div>';
  });
  html+='</div>';

  html+='<div class="section"><div class="section-title"><span class="bar"></span>选择权清单</div><div class="two-col">';
  html+='<div class="col ok"><div class="ct">✅ 你说得出口的「不」</div><div>'+canSay.map(x=>'· '+x).join('<br>')+'</div></div>';
  html+='<div class="col gap"><div class="ct">❌ 你想说但买不起的「不」</div><div>'+cantSay.map(x=>'· '+x).join('<br>')+'</div></div>';
  html+='</div></div>';

  if(EGGS.length){
    html+='<div class="section"><div class="section-title"><span class="bar"></span>账本批注</div>';
    html+='<div class="note-box">'+EGGS.map(e=>'<div style="margin-bottom:7px">· '+e+'</div>').join('')+'</div></div>';
  }

  const shareTxt='我刚做完「自由速算」——我的自由余额：'+tier+'（五账综合'+totalPct+'%）。你的呢？';
  html+='<div class="section"><div class="section-title"><span class="bar"></span>拿去晒</div>';
  html+='<div class="share-box" id="shareTxt">'+shareTxt+'</div></div>';

  html+='<div class="hook"><div class="h1">想把这页账算成真正的人生规划？</div><div class="h2">深度版「一天审计」：上午盘账户 → 下午列选择权清单 → 傍晚交付你的个人自由资产负债表<br>速算表是地图，审计是施工</div></div>';
  html+='<div class="footer-note">自由速算 · 给自由算账 · 答得越诚实，账越好看</div>';
  html+='<div style="margin-top:16px;display:flex;gap:10px">';
  html+='<button class="btn btn-ghost" style="flex:1;background:transparent;border:1.5px solid var(--line);border-radius:14px;padding:15px;font-size:14px;color:var(--muted);cursor:pointer" onclick="copyShare()">复制分享语</button>';
  html+='<button class="btn btn-dark" style="flex:1" onclick="location.reload()">再算一次</button></div>';

  el.innerHTML=html;
  show('screen-report');
  setTimeout(()=>{el.querySelectorAll('.dim-fill').forEach(f=>{f.style.width=f.dataset.w+'%'})},120);
}
function copyShare(){
  const txt=document.getElementById('shareTxt').textContent;
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
  const t=$('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600);
}
</script>
</body>
</html>

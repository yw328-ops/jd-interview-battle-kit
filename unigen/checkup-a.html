<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>不可生成性体检</title>
<style>
  :root{
    --ink:#1c1c1e; --paper:#f6f4ef; --card:#ffffff; --line:#e4e0d8;
    --gold:#a8744a; --gold-soft:#f0e6da; --muted:#8a8578; --danger:#9a3e2e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding:0 0 60px}
  /* ---------- 通用 ---------- */
  .screen{display:none;padding:32px 24px;animation:fade .35s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .kicker{font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;font-weight:600}
  h1{font-size:30px;line-height:1.3;font-weight:700;letter-spacing:.5px}
  h2{font-size:20px;line-height:1.45;font-weight:700}
  .sub{font-size:14px;color:var(--muted);line-height:1.8;margin-top:12px}
  .btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s, opacity .15s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-gold{background:var(--gold);color:#fff}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  /* ---------- 开场 ---------- */
  #screen-start{text-align:left}
  .seal{width:64px;height:64px;border-radius:18px;background:var(--ink);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:28px;font-weight:700}
  .start-meta{margin-top:36px;font-size:13px;color:var(--muted);line-height:2}
  /* ---------- 题目 ---------- */
  .progress-wrap{margin-bottom:8px}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
  .progress-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s ease}
  .q-counter{font-size:13px;color:var(--gold);font-weight:600;margin:22px 0 6px}
  .q-title{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:22px}
  .q-dim{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:10px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;font-size:14.5px;line-height:1.65;cursor:pointer;transition:border-color .15s, background .15s;text-align:left;font-family:inherit;color:var(--ink)}
  .opt:active{border-color:var(--gold)}
  .opt.sel{border-color:var(--gold);background:var(--gold-soft)}
  .multi-hint{font-size:12px;color:var(--muted);margin:14px 0 10px}
  .next-row{display:flex;gap:10px;margin-top:20px}
  .next-row .btn{flex:1}
  .btn-back{flex:0 0 auto;width:auto;padding:16px 18px;background:transparent;border:1.5px solid var(--line);border-radius:14px;font-size:14px;color:var(--muted);cursor:pointer}
  /* ---------- loading ---------- */
  #screen-loading{text-align:center;padding-top:90px}
  .scanner{margin:0 auto 30px;width:72px;height:72px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{font-size:15px;color:var(--ink);font-weight:600}
  .loading-sub{font-size:12px;color:var(--muted);margin-top:10px}
  /* ---------- 报告 ---------- */
  #screen-report{padding-top:28px}
  .report-head{text-align:left}
  .report-seal{font-size:12px;color:var(--gold);letter-spacing:3px;font-weight:600;margin-bottom:14px}
  .report-main{font-size:24px;font-weight:700;line-height:1.5;margin-bottom:6px}
  .report-main em{font-style:normal;color:var(--gold)}
  .report-sub{font-size:13px;color:var(--muted);line-height:1.9;margin-top:12px}
  .section{margin-top:32px}
  .section-title{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .section-title .bar{width:3px;height:14px;background:var(--gold);border-radius:2px}
  .dim-card{background:var(--card);border-radius:14px;padding:18px 18px 16px;margin-bottom:12px;border:1px solid var(--line)}
  .dim-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .dim-name{font-size:15px;font-weight:700}
  .dim-pct{font-size:15px;font-weight:700;color:var(--gold)}
  .dim-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
  .dim-fill{height:100%;background:var(--ink);border-radius:3px;width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
  .dim-talk{font-size:13px;line-height:1.85;color:#3d3a34}
  .dim-act{font-size:12.5px;line-height:1.8;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--gold)}
  .dim-act b{color:var(--gold);font-weight:600}
  .note-box{background:var(--gold-soft);border-radius:14px;padding:16px 18px;font-size:13px;line-height:1.9;margin-top:16px}
  .note-box b{color:var(--gold)}
  .boss-box{background:var(--ink);color:#f0ede6;border-radius:14px;padding:18px;margin-top:14px;font-size:13.5px;line-height:1.9}
  .boss-box .boss-label{font-size:11px;letter-spacing:2px;color:var(--gold);margin-bottom:8px;font-weight:600}
  .share-box{margin-top:18px;background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:14px 16px;font-size:13px;color:#4a463e;line-height:1.9}
  .hook{margin-top:26px;padding:20px;border-radius:16px;background:linear-gradient(135deg,#1c1c1e,#2c2a28);color:#f0ede6;text-align:center}
  .hook .h1{font-size:15px;font-weight:700;line-height:1.6}
  .hook .h2{font-size:12px;color:#b9b2a5;margin-top:8px;line-height:1.8}
  .footer-note{text-align:center;font-size:11px;color:#b9b2a5;margin-top:18px}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;white-space:nowrap}
  .toast.show{opacity:1}
  .dim-highlight{outline:2px solid var(--gold)}
</style>
</head>
<body>
<div class="wrap">

  <!-- 开场 -->
  <div class="screen active" id="screen-start">
    <div class="seal">⛰</div>
    <div class="kicker">UNREPLACEABLE CHECKUP</div>
    <h1>不可生成性<br>体检</h1>
    <p class="sub">AI取代你，需要先活一遍你的人生。<br>这不是考试——AI考不过的东西，才考你。</p>
    <div class="start-meta">
      · 18 道题，没有标准答案<br>
      · 不评分、不审判，只出成分<br>
      · 约 5 分钟，答完生成报告
    </div>
    <div style="margin-top:34px">
      <button class="btn btn-dark" onclick="startTest()">开始体检</button>
      <div style="height:12px"></div>
      <div style="text-align:center;font-size:12px;color:var(--muted)">答得越诚实，报告越扎心</div>
    </div>
  </div>

  <!-- 题目 -->
  <div class="screen" id="screen-quiz">
    <div class="progress-wrap">
      <div class="progress-label"><span id="qProgressText">第 1 / 18 题</span><span>这不是考试</span></div>
      <div class="progress-bar"><div class="progress-fill" id="qProgressFill"></div></div>
    </div>
    <div class="q-counter" id="qCounter">PART 01</div>
    <div class="q-title" id="qTitle"></div>
    <div class="q-dim" id="qDim"></div>
    <div class="opts" id="qOpts"></div>
    <div class="next-row" style="display:none" id="nextRow">
      <button class="btn-back" onclick="prevQ()">← 上一题</button>
      <button class="btn btn-dark" id="nextBtn" onclick="nextQ()">下一题</button>
    </div>
  </div>

  <!-- Loading -->
  <div class="screen" id="screen-loading">
    <div class="scanner"></div>
    <div class="loading-text" id="loadingText">正在扫描你的肉身经验…</div>
    <div class="loading-sub">AI 正在试图模仿你，请稍候</div>
  </div>

  <!-- 报告 -->
  <div class="screen" id="screen-report"></div>

</div>
<div class="toast" id="toast">已复制，去晒吧</div>

<script>
/* ============ 题库 ============
   dims: p=拍板力 t=信任余额 b=肉身经验 f=失败存款 r=担事指数
   score: 每选项 {dim:分值}，个别选项带 egg(彩蛋句) */
const DIMS = [
  {id:'p', name:'拍板力'},
  {id:'t', name:'信任余额'},
  {id:'b', name:'肉身经验'},
  {id:'f', name:'失败存款'},
  {id:'r', name:'担事指数'}
];
const QUESTIONS = [
  {dim:'p', part:'PART 01 · 拍板力', title:'凌晨两点，项目上线前你发现一个只有你知道的隐患：修=延期一周、得罪客户；不修=赌它不出事。你——', opts:[
    {t:'立刻打电话叫醒团队开修', s:{p:3,r:1}},
    {t:'赌一把先上线，然后整夜盯着它', s:{p:2}},
    {t:'发消息给老板，让他定', s:{p:0}},
    {t:'先抽根烟，抽完再选', s:{p:1}, egg:'你选了这个选项——说明你在乎的不是答案，是节奏。AI没有烟，这是你的优势。'}
  ]},
  {dim:'p', part:'PART 01 · 拍板力', title:'你跟老板意见相反，你的判断需要两天才能验证，但方案明天就得交。你——', opts:[
    {t:'按自己的判断交，附一页风险说明', s:{p:3}},
    {t:'拖一天，验证完再交', s:{p:2}},
    {t:'按老板说的做，省得背锅', s:{p:0}},
    {t:'交两份方案，让老板自己选', s:{p:1}}
  ]},
  {dim:'p', part:'PART 01 · 拍板力', title:'你上一次主动推翻自己昨天的决定，是——', opts:[
    {t:'昨天', s:{p:3}},
    {t:'上周', s:{p:2}},
    {t:'上个月', s:{p:1}},
    {t:'我从不改', s:{p:0}, egg:'AI也从不改自己的决定——你俩这一点，倒是挺像的。'}
  ]},
  {dim:'p', part:'PART 01 · 拍板力', title:'一个没有标准答案、没有参考案例的任务砸下来，你的第一反应——', opts:[
    {t:'兴奋：终于轮到我定义了', s:{p:3}},
    {t:'先找三个对标案例压压惊', s:{p:1}},
    {t:'有点慌，先拖两天再说', s:{p:0}},
    {t:'让AI先出一版看看', s:{p:0}, egg:'AI能给答案的事，都不算拍板。你刚刚把一次拍板机会让出去了。'}
  ]},
  {dim:'t', part:'PART 02 · 信任余额', title:'深夜你发了一条仅自己可见的话，会收到几条"你还好吗"——', opts:[
    {t:'3条以上，有人真的在盯着我', s:{t:3}},
    {t:'1-2条', s:{t:2}},
    {t:'没人发现——我发完就删了', s:{t:0}, egg:'你太能扛了，扛到别人以为你不需要。'}
  ]},
  {dim:'t', part:'PART 02 · 信任余额', title:'你想离职，不投简历，能直接让几个人为你内推、还愿意拍胸脯担保——', opts:[
    {t:'三个以上，我心里有数', s:{t:3}},
    {t:'能想到一两个', s:{t:2}},
    {t:'不确定，没想过这事', s:{t:1}},
    {t:'我从不麻烦别人', s:{t:0}, egg:'独立是美德，但"从不麻烦人"的人，别人也会不好意思麻烦你——包括帮你。'}
  ]},
  {dim:'t', part:'PART 02 · 信任余额', title:'有下属或同事跟你说过"只有你敢跟我说真话"吗——', opts:[
    {t:'有人说过，不止一次', s:{t:3}},
    {t:'隐约感觉有，没人明说', s:{t:2}},
    {t:'没听过——可能我平时太客气了', s:{t:0}}
  ]},
  {dim:'b', part:'PART 03 · 肉身经验', title:'下面这些，你亲历过几样？（选所有经历过的）', multi:true, opts:[
    {t:'亲手搞砸过一个项目', s:{b:0.5}},
    {t:'在众目睽睽之下被否定过', s:{b:0.5}},
    {t:'熬过一段没人知道你在熬的日子', s:{b:0.5}},
    {t:'在现场闻过机房/工厂/后厨/后台的真实气味', s:{b:0.5}},
    {t:'被人拍着桌子骂过', s:{b:0.5}},
    {t:'带一件事从0到1完整走通过', s:{b:0.5}},
    {t:'独自在陌生城市生活过', s:{b:0.5}}
  ]},
  {dim:'b', part:'PART 03 · 肉身经验', title:'过去一个月，你有过几次"身体在场"的体验？（现场演出 / 跟真人面对面聊超两小时 / 独自出门走走）', opts:[
    {t:'三次以上', s:{b:3}},
    {t:'一两次', s:{b:2}},
    {t:'一次都没有——我活在线上', s:{b:0}, egg:'你太久没在场了，信息源跟AI越来越像。'}
  ]},
  {dim:'b', part:'PART 03 · 肉身经验', title:'你说过"这个我亲自去过/亲眼见过"，并且因此做了跟别人不一样的决定吗——', opts:[
    {t:'说过，还因此躲过坑', s:{b:3}},
    {t:'说过，但没影响什么决定', s:{b:1}},
    {t:'我一般信报告和二手资料', s:{b:0}, egg:'那你和AI的信息源，是一样的。'}
  ]},
  {dim:'f', part:'PART 04 · 失败存款', title:'你最近一次搞砸一件事，是在——', opts:[
    {t:'不久之前，具体画面我都记得', s:{f:3}},
    {t:'有，但不想细想', s:{f:1}},
    {t:'我好像没怎么搞砸过', s:{f:0}, egg:'想不起来？那AI可能比你还了解你。'}
  ]},
  {dim:'f', part:'PART 04 · 失败存款', title:'你愿意把哪段失败，讲给一个正在低谷的年轻人听——', opts:[
    {t:'有一段，我讲过，还真的帮到了人', s:{f:3}},
    {t:'有，但从来没讲过', s:{f:1}},
    {t:'我的人生没有失败，只有教训', s:{f:0}, egg:'这句话本身，就很有故事——好吧，也许你真的没有。'}
  ]},
  {dim:'f', part:'PART 04 · 失败存款', title:'你简历上最不敢写的一段经历，其实是——', opts:[
    {t:'有一段，但我知道它教会我的最多', s:{f:3}},
    {t:'有，但怕HR不懂', s:{f:1}},
    {t:'没有不敢写的，我全部坦荡', s:{f:1}, egg:'要么你已百炼成钢，要么——你还没遇到真正摔过的那一次。'}
  ]},
  {dim:'r', part:'PART 05 · 担事指数', title:'一份文件摆在你面前，签了就要为结果负责。签字那一刻你——', opts:[
    {t:'该签就签，签完我负责', s:{r:3}},
    {t:'反复检查三遍再签', s:{r:2}},
    {t:'能不签就不签', s:{r:0}},
    {t:'找别人代签', s:{r:0}, egg:'你把责任推出去的同时，把信任也推出去了。'}
  ]},
  {dim:'r', part:'PART 05 · 担事指数', title:'团队里有个很努力但确实跟不上的老同事，年终评审——', opts:[
    {t:'我当面跟他说清楚，给足体面', s:{r:3}},
    {t:'让HR去谈', s:{r:1}},
    {t:'给个C，让他自己悟', s:{r:1}},
    {t:'拖到不得不处理', s:{r:0}, egg:'拖不是温柔——是让他在错误的路上，又多走了半年。'}
  ]},
  {dim:'r', part:'PART 05 · 担事指数', title:'客户要你承诺一件你只有七成把握的事，你——', opts:[
    {t:'承诺，然后用命去补那三成', s:{r:3}},
    {t:'承诺七成，把风险讲在前面', s:{r:2}},
    {t:'含糊过去，到时候再说', s:{r:0}},
    {t:'先答应下来，拿到单子再说', s:{r:0}, egg:'透支的信用，最后都要连本带利还。'}
  ]},
  {dim:'p', part:'PART 06 · 终局问答', title:'如果明天AI接管你所有"能干"的活——', opts:[
    {t:'太好了，我终于有空干它干不了的了', s:{p:3}},
    {t:'先慌三天，再找出路', s:{p:1}},
    {t:'跟它比一场，看谁干得好', s:{p:1}, egg:'比"能干"，你赢面不大；比"为什么干"，它永远不懂。'},
    {t:'那我可以退休了', s:{p:0}, egg:'小心——这可能说明，你还没发现自己不可生成的部分。'}
  ]},
  {dim:'t', part:'PART 06 · 终局问答', title:'你上一次为一件"不是分内的事"站出来（替人说话 / 揽一件没人要的活 / 当众制止一件不对的事），是——', opts:[
    {t:'最近就有', s:{t:3,r:1}},
    {t:'有过，但挺久以前了', s:{t:1}},
    {t:'我一般不出头', s:{t:0}, egg:'出头不是莽——那是给信用余额充值。'}
  ]}
];

/* 维度满分：p:3+3+3+3+3=15, t:3+3+3+3=12(含18题的r?), b:3.5+3+3=9.5, f:3+3+3=9, r:3+3+3+1=10 */
const MAX = {p:15, t:12, b:9.5, f:9, r:10};

const TALK = {
  p:{hi:'信息不全时你敢定——这是AI最学不会的人类动作：它永远在等更多数据，而机会不等。', lo:'你习惯等更多信息、等别人先表态——可AI也在等。等的人，永远轮不到定义。'},
  t:{hi:'有人愿意为你说话。这是钱买不到、AI生成不了的关系资产。', lo:'你太独立了，独立到别人不敢靠近——信用余额是从"被麻烦"开始积累的。'},
  b:{hi:'你闻过、痛过、在场过。这些数据不在任何训练集里。', lo:'你活在线上太久了——信息源跟AI越来越像，是你最该警惕的事。'},
  f:{hi:'你摔过，所以你知道坑在哪。AI的数据库里没有"我错了"。', lo:'没摔过的人，要么运气太好，要么摔的时候没敢看。'},
  r:{hi:'"我负责"三个字，是职场最稀缺的签名。', lo:'你把责任推出去的时候，信任也一起推出去了。'}
};
const ACT = {
  p:{hi:'把你最近一次拍板写进简历——它比任何技能列表都值钱。', lo:'下周找一件小事，在信息只有七成时做决定，试试天塌不塌。'},
  t:{hi:'给你的"担保人"发条消息——关系要存，也要记得取。', lo:'下次遇到坎，试着开口麻烦一个人。'},
  b:{hi:'把你的现场经验写成小故事——那是你的独家语料。', lo:'这个周末，去一个真实的地方，跟真人说十分钟话。'},
  f:{hi:'把最痛的那次失败讲给一个人听——讲出来，它就变成资产。', lo:'下次搞砸，别急着翻篇，先记下来。'}
};
const ACT_R = {hi:'主动认领一件没人要的活，让"交给你放心"成为你的标签。', lo:'从签一份小文件开始，练习说"我负责"。'};

const MAINLINE = {
  p:'你的核心成分是拍板力。AI能给你一百个选项，但"凌晨两点那个电话"，只有你能打。',
  t:'你的核心成分是信任余额。AI可以模仿你的语气，但模仿不了别人愿意为你说话。',
  b:'你的核心成分是肉身经验。AI读遍全网，也读不到你闻过的那阵真实气味。',
  f:'你的核心成分是失败存款。AI没有失败史——你交过的学费，是它永远缺的数据库。',
  r:'你的核心成分是担事指数。AI能生成一万份报告，但"我负责"三个字，它签不了。'
};
const BOSS = {
  p:'这个人能扛事，可以放权。面试话术：主导过关键决策，包括一次信息不全时的押注。',
  t:'团队愿意跟他走。面试话术：有X个愿意为我担保的前同事。',
  b:'他见过真东西。面试话术：这个判断来自我亲历的现场。',
  f:'他交过学费。面试话术：我复盘过最贵的一次失败，这是教训清单。',
  r:'敢签字。面试话术：交给我，你可以放心。'
};

/* ============ 状态 ============ */
let qi = 0;                 // 当前题 index
const answers = [];         // 每题的 {sel:Set或index}
const eggs = [];            // 彩蛋句收集
const scores = {p:0,t:0,b:0,f:0,r:0};

function $(id){return document.getElementById(id)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}

/* ============ 流程 ============ */
function startTest(){qi=0;show('screen-quiz');renderQ()}

function renderQ(){
  const q = QUESTIONS[qi];
  $('qCounter').textContent = q.part;
  $('qTitle').textContent = q.title;
  $('qDim').textContent = 'PART ' + String(Math.floor(qi/3)+1).padStart(2,'0') + ' · 共 18 题';
  $('qProgressText').textContent = '第 ' + (qi+1) + ' / 18 题';
  $('qProgressFill').style.width = (qi/18*100) + '%';
  $('qOpts').innerHTML = '';
  const sel = answers[qi] || (q.multi ? new Set() : null);
  q.opts.forEach((op,oi)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = op.t;
    if(q.multi){ if(sel && sel.has(oi)) b.classList.add('sel'); }
    else if(sel===oi) b.classList.add('sel');
    b.onclick = ()=>choose(oi,b);
    $('qOpts').appendChild(b);
  });
  $('nextRow').style.display = qi>0 || (answers[0]!==undefined && answers[0]!==null) ? 'flex' : (answers[0]!==undefined?'flex':'none');
  // 首题不显示上一题
  document.querySelector('.btn-back').style.visibility = qi===0 ? 'hidden':'visible';
  const canNext = answers[qi] && (q.multi ? answers[qi].size>0 : true);
  $('nextBtn').textContent = qi===QUESTIONS.length-1 ? '生成报告' : '下一题';
  $('nextBtn').style.opacity = canNext?1:.4;
}
function choose(oi, el){
  const q = QUESTIONS[qi];
  const allBtns = $('qOpts').querySelectorAll('.opt');
  if(q.multi){
    if(!answers[qi]) answers[qi]=new Set();
    if(answers[qi].has(oi)){answers[qi].delete(oi);el.classList.remove('sel');}
    else{answers[qi].add(oi);el.classList.add('sel');}
  } else {
    allBtns.forEach(b=>b.classList.remove('sel'));
    el.classList.add('sel');
    answers[qi]=oi;
    // 立即进下一题（单选快节奏）
    setTimeout(()=>{ if(qi<QUESTIONS.length-1){qi++;renderQ()} else {generate()} }, 220);
    return;
  }
  $('nextBtn').style.opacity = (answers[qi] && answers[qi].size>0)?1:.4;
}
function nextQ(){
  const q = QUESTIONS[qi];
  if(!answers[qi] || (q.multi && answers[qi].size===0)) return;
  if(qi<QUESTIONS.length-1){qi++;renderQ()}
  else generate();
}
function prevQ(){ if(qi>0){qi--;renderQ()} }

/* ============ 计分 & 报告 ============ */
function generate(){
  // 汇总分数
  Object.keys(scores).forEach(k=>scores[k]=0);
  eggs.length=0;
  QUESTIONS.forEach((q,i)=>{
    const a = answers[i];
    if(q.multi){
      a.forEach(oi=>{const o=q.opts[oi];Object.keys(o.s).forEach(d=>scores[d]+=o.s[d]);});
    } else if(a!==undefined && a!==null){
      const o = q.opts[a];
      Object.keys(o.s).forEach(d=>scores[d]+=o.s[d]);
      if(o.egg) eggs.push(o.egg);
    }
  });
  // 显示 loading
  const ls=['正在扫描你的肉身经验…','正在清点你的失败存款…','正在数有多少人愿意为你说话…','正在测试AI模仿你的成本…'];
  $('loadingText').textContent = ls[Math.floor(Math.random()*ls.length)];
  show('screen-loading');
  setTimeout(buildReport, 2300);
}

function buildReport(){
  const pcts = {}; DIMS.forEach(d=>pcts[d.id]=Math.min(100, Math.round(scores[d.id]/MAX[d.id]*100)));
  // 核心成分 = 百分比最高
  let core = DIMS[0]; DIMS.forEach(d=>{ if(pcts[d.id]>pcts[core.id]) core=d; });
  // 副成分
  const sorted = [...DIMS].sort((a,b)=>pcts[b.id]-pcts[a.id]);
  const second = sorted[1];
  const el = $('screen-report');

  let html = '';
  html += '<div class="report-head">';
  html += '<div class="report-seal">UNREPLACEABLE REPORT</div>';
  html += '<div class="report-main">AI取代你，需要<br>先<em>活一遍</em>你的人生。</div>';
  html += '<p class="report-sub">' + MAINLINE[core.id] + '</p>';
  html += '<p class="report-sub">你的成分里还有一笔可观的<b>'+DIMS.find(d=>d.id===second.id).name+'</b>——' + TALK[second.id][pcts[second.id]>=50?'hi':'lo'] + '</p>';
  html += '</div>';

  // 五维
  html += '<div class="section"><div class="section-title"><span class="bar"></span>不可生成性成分报告</div>';
  DIMS.forEach(d=>{
    const hi = pcts[d.id]>=50;
    html += '<div class="dim-card">';
    html += '<div class="dim-top"><span class="dim-name">'+d.name+'</span><span class="dim-pct">'+pcts[d.id]+'%</span></div>';
    html += '<div class="dim-bar"><div class="dim-fill" data-w="'+pcts[d.id]+'"></div></div>';
    html += '<div class="dim-talk">'+(d.id==='r'?TALK.r[hi?'hi':'lo']:(d.id==='f'?TALK.f[hi?'hi':'lo']:TALK[d.id][hi?'hi':'lo']))+'</div>';
    const actTxt = d.id==='r' ? ACT_R[hi?'hi':'lo'] : ACT[d.id][hi?'hi':'lo'];
    html += '<div class="dim-act"><b>增值动作 ▸</b> '+actTxt+'</div>';
    html += '</div>';
  });
  html += '</div>';

  // 彩蛋
  if(eggs.length){
    html += '<div class="section"><div class="section-title"><span class="bar"></span>AI观察笔记</div>';
    html += '<div class="note-box">'+eggs.map(e=>'<div style="margin-bottom:8px">· '+e+'</div>').join('')+'</div></div>';
  }

  // 老板翻译版
  html += '<div class="section"><div class="section-title"><span class="bar"></span>老板 / 猎头翻译版</div>';
  html += '<div class="boss-box"><div class="boss-label">把这句讲给你老板听</div>'+BOSS[core.id]+'</div></div>';

  // 分享
  const shareTxt = '我刚做完「不可生成性体检」——AI取代我，得先活一遍我的人生。我的核心成分是'+core.name+'（'+pcts[core.id]+'%）。来测测AI偷不走你什么。';
  html += '<div class="section"><div class="section-title"><span class="bar"></span>拿去晒</div>';
  html += '<div class="share-box" id="shareTxt">'+shareTxt+'</div></div>';

  // 钩子 → B 互跳
  html += '<div class="hook"><div class="h1">想知道这些成分能换成多少自由？</div><div class="h2">「自由速算」已上线——把自由从感觉算成余额：<br>你偷不走的东西 × 你买得起的选择权<br><a href="free-calc.html" style="color:#e6cfa6;text-decoration:underline">去算你的自由余额 →</a></div></div>';
  html += '<div class="footer-note">不可生成性体检 · 答得越诚实，报告越扎心</div>';
  html += '<div style="margin-top:16px;display:flex;gap:10px">';
  html += '<button class="btn btn-ghost" style="flex:1" onclick="copyShare()">复制分享语</button>';
  html += '<button class="btn btn-dark" style="flex:1" onclick="location.reload()">再测一次</button>';
  html += '</div>';

  el.innerHTML = html;
  show('screen-report');
  // 动画条
  setTimeout(()=>{el.querySelectorAll('.dim-fill').forEach(f=>{f.style.width=f.dataset.w+'%'})},120);
}

function copyShare(){
  const txt = document.getElementById('shareTxt').textContent;
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
  const t=$('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600);
}
</script>
</body>
</html>
